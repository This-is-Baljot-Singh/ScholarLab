name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev
      - run: npm run build
        env:
          # Project site is served from https://<user>.github.io/ScholarLab/
          VITE_BASE: /ScholarLab/
          # Set the repo variable VITE_API_URL to a deployed backend; Pages is static-only.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # GitHub Pages serves 404.html for unknown paths; reusing index.html makes
      # client-side routes (e.g. /ScholarLab/student/overview) work on deep links/refresh.
      - run: cp dist/index.html dist/404.html
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
